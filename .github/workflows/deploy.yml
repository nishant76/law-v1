name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: superadvocate-prod
  REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev/superadvocate-prod/superadvocate

# Two deploys running at once could race on the same database: one applying a
# migration while the other deploys code that predates it. Serialise the whole
# pipeline, and never cancel a run in progress — an interrupted migration is far
# worse than a queued deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Database migration ──────────────────────────────────────────────────────
  # Runs FIRST, and is the approval gate: `environment: production` makes the
  # whole pipeline wait for a reviewer here, before anything at all touches
  # production. Migrations are additive, so migrate-then-deploy leaves the old
  # revision working against the new schema for the minute between the two.
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Match the backend image (Dockerfile: python:3.11.7-slim-bullseye) so the
      # migration runs on the same interpreter as the app.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only what alembic env.py actually needs — it imports backend.core.config
      # and backend.models, which pull in SQLAlchemy and dotenv and nothing else.
      # Installing the full requirements.txt here would drag in Playwright and
      # Chromium for no reason.
      - name: Install migration dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
            "alembic==1.13.0" "sqlalchemy[asyncio]==2.0.25" "asyncpg==0.29.0" python-dotenv

      # DATABASE_URL is the production connection string, so it is masked before
      # it can reach a log line and passed on via $GITHUB_ENV rather than being
      # echoed into a command.
      - name: Load DATABASE_URL from Secret Manager
        run: |
          DB_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL --project="${PROJECT_ID}")"
          if [ -z "$DB_URL" ]; then
            echo "::error::DATABASE_URL secret is empty — refusing to run migrations."
            exit 1
          fi
          echo "::add-mask::$DB_URL"
          {
            echo "DATABASE_URL<<__EOF__"
            echo "$DB_URL"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      # Print the gap being closed before closing it, so the run log shows what
      # was applied to production rather than only that "something" was.
      - name: Show pending migrations
        working-directory: backend/migrations
        run: |
          echo "Current revision:"; python -m alembic current
          echo "Target head:";      python -m alembic heads

      - name: Apply migrations
        working-directory: backend/migrations
        run: python -m alembic upgrade head

      - name: Confirm revision
        working-directory: backend/migrations
        run: python -m alembic current

  # ── Backend ─────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Backend → Cloud Run
    runs-on: ubuntu-latest
    environment: production
    needs: migrate

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ env.REGISTRY }}/backend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/backend:latest \
            .

          docker push ${{ env.REGISTRY }}/backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/backend:latest

      - name: Deploy backend to Cloud Run
        id: deploy-backend
        run: |
          gcloud run deploy superadvocate-backend \
            --image ${{ env.REGISTRY }}/backend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300 \
            --set-env-vars "ENVIRONMENT=production,USE_AZURE_OPENAI=false,FRONTEND_URL=${{ vars.FRONTEND_URL }}" \
            --set-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,ECOURTS_API_TOKEN=ECOURTS_API_TOKEN:latest" \
            --quiet

  # ── Frontend ─────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Frontend → Cloud Run
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-backend

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Get backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe superadvocate-backend \
            --region ${{ env.REGION }} \
            --format "value(status.url)")
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push frontend
        working-directory: frontends/law-v2
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg VITE_API_URL=${{ steps.backend-url.outputs.url }} \
            -t ${{ env.REGISTRY }}/frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/frontend:latest \
            .

          docker push ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/frontend:latest

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy superadvocate-frontend \
            --image ${{ env.REGISTRY }}/frontend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --quiet
